name: Limieten

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true

configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  LimitenKit:
    path: LimitenKit

targets:
  Limieten:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: LimitenKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Limieten
        CFBundleDevelopmentRegion: nl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: limieten
            CFBundleURLSchemes:
              - limieten
    settings:
      base:
        PRODUCT_NAME: Limieten
        PRODUCT_BUNDLE_IDENTIFIER: $(LIMIETEN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # The widget extension target (LimietenWidget) is added in phase 3.
